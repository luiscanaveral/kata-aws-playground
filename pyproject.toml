[project]
name = "kata-aws-architecture"
version = "0.1.0"
description = "AWS Local Playground with Floci"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35",
    "pillow>=10.0",
    "cassandra-driver>=3.29",
    "redis>=5.0",
    "aws-cdk-lib>=2.150",
    "constructs>=10.0",
]

[tool.setuptools.package-data]
"*" = ["*.sh"]

[tool.setuptools.packages.find]
where = ["scenarios", "infrastructure"]
include = ["scenarios*", "infrastructure*"]

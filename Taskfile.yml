version: "3"

vars:
  AWS_ENDPOINT: http://localhost:4566
  AWS_REGION: us-east-1

env:
  AWS_ENDPOINT_URL: "{{.AWS_ENDPOINT}}"
  AWS_DEFAULT_REGION: "{{.AWS_REGION}}"
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  up:
    desc: Start Floci and infrastructure
    cmds:
      - docker compose up -d
      - echo "Waiting for Floci to be ready..."
      - >
        until curl -s http://localhost:4566/_localstack/health > /dev/null 2>&1; do
          sleep 1
        done
      - echo "Floci is ready!"

  down:
    desc: Stop Floci
    cmds:
      - docker compose down

  logs:
    desc: Tail Floci logs
    cmds:
      - docker compose logs -f

  init:
    desc: Deploy all CDK infrastructure stacks
    cmds:
      - uv run python infrastructure/deploy.py

  clean:
    desc: Remove all data and stop services
    cmds:
      - docker compose down -v

  # ─── SQS → Lambda ────────────────────────────────────

  sqs-lambda:infrastructure:
    desc: Deploy SQS → Lambda infrastructure (queue, function, ESM)
    cmds:
      - uv run python infrastructure/deploy.py SqsLambdaStack

  sqs-lambda:run:
    desc: Send order events to SQS (triggers Lambda via ESM)
    deps: [sqs-lambda:infrastructure]
    cmds:
      - uv run python -m scenarios.sqs_lambda.run

  # ─── Lambda Image Upload → S3 ────────────────────────

  image-upload:infrastructure:
    desc: Deploy Image Upload infrastructure (bucket, function)
    cmds:
      - uv run python infrastructure/deploy.py ImageUploadStack

  image-upload:run:
    desc: Invoke Lambda to upload an image to S3
    deps: [image-upload:infrastructure]
    cmds:
      - uv run python -m scenarios.image_upload.run

  # ─── EC2 WordPress ───────────────────────────────────

  ec2-wordpress:infrastructure:
    desc: Deploy EC2 WordPress infrastructure (VPC, SG, instance)
    cmds:
      - uv run python infrastructure/deploy.py Ec2WordpressStack

  ec2-wordpress:run:
    desc: Show WordPress EC2 instance status and access info
    deps: [ec2-wordpress:infrastructure]
    cmds:
      - uv run python -m scenarios.ec2_wordpress.run

  # ─── IAM API Auth ────────────────────────────────────

  iam-api:infrastructure:
    desc: Deploy IAM API Auth infrastructure (API GW, Lambda, users)
    cmds:
      - uv run python infrastructure/deploy.py IamApiAuthStack

  iam-api:run:
    desc: Test API Gateway with IAM authorization
    deps: [iam-api:infrastructure]
    cmds:
      - uv run python -m scenarios.iam_api_auth.run

  # ─── Cassandra Orders ────────────────────────────────

  cassandra-orders:infrastructure:
    desc: Deploy Cassandra Orders infrastructure (SQS, Lambda)
    cmds:
      - uv run python infrastructure/deploy.py CassandraOrdersStack

  cassandra-orders:run:
    desc: Run Cassandra orders CRUD demonstration
    deps: [cassandra-orders:infrastructure]
    cmds:
      - task: setup:cassandra-schema
      - uv run python -m scenarios.cassandra_orders.run

  # ─── Step Functions ──────────────────────────────────

  stepfunctions:infrastructure:
    desc: Deploy Step Functions infrastructure (Lambdas, state machine)
    cmds:
      - uv run python infrastructure/deploy.py StepFunctionsStack

  stepfunctions:run:
    desc: Execute Step Functions workflow with test orders
    deps: [stepfunctions:infrastructure]
    cmds:
      - uv run python -m scenarios.stepfunctions_orchestration.run

  # ─── DynamoDB Tickets ────────────────────────────────

  dynamodb-tickets:infrastructure:
    desc: Deploy DynamoDB Tickets infrastructure (table, API GW, Lambda)
    cmds:
      - uv run python infrastructure/deploy.py DynamodbTicketsStack

  dynamodb-tickets:run:
    desc: Test ticket reservation + purchase flow
    deps: [dynamodb-tickets:infrastructure]
    cmds:
      - uv run python -m scenarios.dynamodb_ticket_system.run

  # ─── Feature Flags ───────────────────────────────────

  feature-flags:infrastructure:
    desc: Deploy feature flags infrastructure (AppConfig, Lambda, API)
    cmds:
      - uv run python infrastructure/deploy.py FeatureFlagsStack

  feature-flags:run:
    desc: Open the feature flags dashboard; toggle widgets via AppConfig
    deps: [feature-flags:infrastructure]
    cmds:
      - uv run python -m scenarios.feature_flags.run

  # ─── SNS Fanout ──────────────────────────────────────

  sns-fanout:infrastructure:
    desc: Deploy SNS fanout infrastructure (topic, queues, processors, APIs)
    cmds:
      - uv run python infrastructure/deploy.py SnsFanoutStack

  sns-fanout:run:
    desc: Publish random posts to SNS every 15s; open the frontend feed
    deps: [sns-fanout:infrastructure]
    cmds:
      - uv run python -m scenarios.sns_fanout.run

  # ─── Notification System ─────────────────────────────

  notification-system:infrastructure:
    desc: Deploy notification system infrastructure (DynamoDB, SQS, SNS, Lambda, API GW)
    cmds:
      - uv run python infrastructure/deploy.py NotificationSystemStack

  notification-system:run:
    desc: Test package tracking with notification dispatch
    deps: [notification-system:infrastructure]
    cmds:
      - uv run python -m scenarios.notification_system.run

  # ─── Shared ──────────────────────────────────────────

  setup:cassandra-schema:
    desc: Create Cassandra keyspace and orders table
    internal: true
    cmds:
      - >
        echo "Waiting for Cassandra to be ready..."
        && until docker compose exec -T cassandra nodetool status 2>/dev/null | grep -q UN; do
          sleep 3
        done
        && echo "Cassandra is ready!"
      - >
        docker compose exec -T cassandra cqlsh -e "
          CREATE KEYSPACE IF NOT EXISTS orders_app
          WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};
        "
      - >
        docker compose exec -T cassandra cqlsh -e "
          CREATE TABLE IF NOT EXISTS orders_app.orders (
            order_id text PRIMARY KEY,
            customer text,
            amount decimal,
            items text,
            status text,
            created_at timestamp
          );
        "
      - echo "Cassandra schema created"

version: "3"

vars:
  AWS_ENDPOINT: http://localhost:4566
  AWS_REGION: us-east-1

env:
  AWS_ENDPOINT_URL: "{{.AWS_ENDPOINT}}"
  AWS_DEFAULT_REGION: "{{.AWS_REGION}}"
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  up:
    desc: Start Floci and infrastructure
    cmds:
      - docker compose up -d
      - echo "Waiting for Floci to be ready..."
      - >
        until curl -s http://localhost:4566/_localstack/health > /dev/null 2>&1; do
          sleep 1
        done
      - echo "Floci is ready!"

  down:
    desc: Stop Floci
    cmds:
      - docker compose down

  logs:
    desc: Tail Floci logs
    cmds:
      - docker compose logs -f

  setup:sqs-lambda:
    desc: Setup SQS -> Lambda scenario resources
    cmds:
      - uv run python -m scenarios.sqs_lambda.setup

  run:sqs-lambda:
    desc: Send order events to SQS (triggers Lambda via event source mapping)
    deps: [setup:sqs-lambda]
    cmds:
      - uv run python -m scenarios.sqs_lambda.run

  setup:image-upload:
    desc: Setup Lambda image upload scenario resources
    cmds:
      - uv run python -m scenarios.image_upload.setup

  run:image-upload:
    desc: Invoke Lambda to upload an image to S3
    deps: [setup:image-upload]
    cmds:
      - uv run python -m scenarios.image_upload.run

  scenario:sqs-lambda:
    desc: Run the full SQS -> Lambda scenario (setup + execute)
    cmds:
      - task: setup:sqs-lambda
      - task: run:sqs-lambda

  scenario:image-upload:
    desc: Run the full Lambda image upload -> S3 scenario (setup + execute)
    cmds:
      - task: setup:image-upload
      - task: run:image-upload

  setup:ec2-wordpress:
    desc: Setup EC2 with WordPress scenario
    cmds:
      - uv run python -m scenarios.ec2_wordpress.setup

  run:ec2-wordpress:
    desc: Show WordPress EC2 instance status and access info
    deps: [setup:ec2-wordpress]
    cmds:
      - uv run python -m scenarios.ec2_wordpress.run

  scenario:ec2-wordpress:
    desc: Run the full EC2 with WordPress scenario
    cmds:
      - task: setup:ec2-wordpress
      - task: run:ec2-wordpress

  setup:iam-api:
    desc: Setup IAM API auth scenario
    cmds:
      - uv run python -m scenarios.iam_api_auth.setup

  run:iam-api:
    desc: Test API Gateway with IAM authorization
    deps: [setup:iam-api]
    cmds:
      - uv run python -m scenarios.iam_api_auth.run

  scenario:iam-api:
    desc: Run the full IAM API auth scenario
    cmds:
      - task: setup:iam-api
      - task: run:iam-api

  setup:cassandra-schema:
    desc: Create Cassandra keyspace and orders table
    cmds:
      - >
        echo "Waiting for Cassandra to be ready..."
        && until docker compose exec -T cassandra nodetool status 2>/dev/null | grep -q UN; do
          sleep 3
        done
        && echo "Cassandra is ready!"
      - >
        docker compose exec -T cassandra cqlsh -e "
          CREATE KEYSPACE IF NOT EXISTS orders_app
          WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};
        "
      - >
        docker compose exec -T cassandra cqlsh -e "
          CREATE TABLE IF NOT EXISTS orders_app.orders (
            order_id text PRIMARY KEY,
            customer text,
            amount decimal,
            items text,
            status text,
            created_at timestamp
          );
        "
      - echo "Cassandra schema created"

  setup:cassandra-orders:
    desc: Setup Cassandra orders scenario
    cmds:
      - task: setup:cassandra-schema
      - uv run python -m scenarios.cassandra_orders.setup

  run:cassandra-orders:
    desc: Run Cassandra orders CRUD demonstration
    deps: [setup:cassandra-orders]
    cmds:
      - uv run python -m scenarios.cassandra_orders.run

  scenario:cassandra-orders:
    desc: Run the full Cassandra orders scenario
    cmds:
      - task: setup:cassandra-orders
      - task: run:cassandra-orders

  setup:stepfunctions:
    desc: Setup Step Functions orchestration scenario
    cmds:
      - uv run python -m scenarios.stepfunctions_orchestration.setup

  run:stepfunctions:
    desc: Execute Step Functions workflow with test orders
    deps: [setup:stepfunctions]
    cmds:
      - uv run python -m scenarios.stepfunctions_orchestration.run

  scenario:stepfunctions:
    desc: Run the full Step Functions orchestration scenario
    cmds:
      - task: setup:stepfunctions
      - task: run:stepfunctions

  setup:dynamodb-tickets:
    desc: Setup DynamoDB ticket selling system
    cmds:
      - uv run python -m scenarios.dynamodb_ticket_system.setup

  run:dynamodb-tickets:
    desc: Test ticket reservation + purchase flow
    deps: [setup:dynamodb-tickets]
    cmds:
      - uv run python -m scenarios.dynamodb_ticket_system.run

  scenario:dynamodb-tickets:
    desc: Run the full DynamoDB ticket selling scenario
    cmds:
      - task: setup:dynamodb-tickets
      - task: run:dynamodb-tickets

  init:
    desc: Initialize all AWS resources (buckets, queues, roles)
    cmds:
      - docker compose exec floci /bin/bash /etc/localstack/init/ready.d/init-aws.sh

  clean:
    desc: Remove all data and stop services
    cmds:
      - docker compose down -v
